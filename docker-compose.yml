services:
  postgres_db:
    image: postgres:15-alpine
    container_name: shop_postgres
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: smartphone_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d smartphone_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: shop_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://shop_user:shop_password@postgres_db:5432/smartphone_shop
    depends_on:
      postgres_db:
        condition: service_healthy
    # ⚡ ДОБАВЛЕНО: Монтируем папку public бэкенда, чтобы сохраняемые картинки не пропадали
    volumes:
      - ./backend/public:/app/public

  frontend:
    build: ./frontend
    container_name: shop_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
